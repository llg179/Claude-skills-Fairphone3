# usb-moded-developer-mode's up() runs an unconditional
#   nmcli connection add con-name "Developer Mode" ...
# and only its down() deletes it again. Any unclean shutdown therefore leaks a
# profile, and they accumulate (96 of them had piled up here, all but one empty)
# until NetworkManager has a pile of same-named connections to choose between.
# Drop the stale ones before the service adds this boot's profile.
[Service]
ExecStartPre=/usr/local/bin/fp3-devmode-cleanup
